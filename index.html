<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habits</title>
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root {
  color-scheme: light;
  --page:        #f9f9f7;
  --surface:     #fcfcfb;
  --surface-2:   #f2f1ec;
  --ink:         #0b0b0b;
  --ink-2:       #52514e;
  --muted:       #898781;
  --grid:        #e1e0d9;
  --axis:        #c3c2b7;
  --border:      rgba(11,11,11,0.10);
  --shadow:      0 1px 2px rgba(11,11,11,.04), 0 8px 24px rgba(11,11,11,.05);

  --accent:      #2a78d6;
  --accent-soft: #cde2fb;
  --good:        #0ca30c;
  --good-text:   #006300;
  --warning:     #fab219;
  --serious:     #ec835a;
  --critical:    #d03b3b;

  /* sequential blue ramp — magnitude only. h0 is the empty slot, off-ramp. */
  --h0: #eeede7;
  --h1: #b7d3f6;
  --h2: #6da7ec;
  --h3: #2a78d6;
  --h4: #184f95;

  --r:   10px;
  --r-s: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #232322;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --muted:       #898781;
    --grid:        #2c2c2a;
    --axis:        #383835;
    --border:      rgba(255,255,255,0.10);
    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --accent:      #3987e5;
    --accent-soft: #0d366b;
    --good-text:   #0ca30c;
    --h0: #232322;
    --h1: #184f95;
    --h2: #256abf;
    --h3: #3987e5;
    --h4: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:        #0d0d0d;
  --surface:     #1a1a19;
  --surface-2:   #232322;
  --ink:         #ffffff;
  --ink-2:       #c3c2b7;
  --muted:       #898781;
  --grid:        #2c2c2a;
  --axis:        #383835;
  --border:      rgba(255,255,255,0.10);
  --shadow:      0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --accent:      #3987e5;
  --accent-soft: #0d366b;
  --good-text:   #0ca30c;
  --h0: #232322;
  --h1: #184f95;
  --h2: #256abf;
  --h3: #3987e5;
  --h4: #86b6ef;
}

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
a { color: var(--accent); }

.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

/* ---- top bar ---- */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.bar { max-width: 980px; margin: 0 auto; padding: 14px 20px 0;
       display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; display:flex; align-items:center; gap:8px; }
.brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.bar .spacer { flex: 1; }
.today-label { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

nav { max-width: 980px; margin: 0 auto; padding: 10px 20px 0; display: flex; gap: 2px; overflow-x: auto; }
nav button {
  padding: 9px 14px 11px; font-size: 14px; color: var(--ink-2);
  border-bottom: 2px solid transparent; white-space: nowrap; border-radius: var(--r-s) var(--r-s) 0 0;
}
nav button:hover { background: var(--surface-2); color: var(--ink); }
nav button[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

.icon-btn {
  width: 34px; height: 34px; border-radius: var(--r-s); display: grid; place-items: center;
  color: var(--ink-2); border: 1px solid transparent;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--ink); }

/* ---- generic ---- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow);
}
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 15px; }
.section-head .sub { font-size: 13px; color: var(--muted); }

.btn {
  padding: 8px 14px; border-radius: var(--r-s); border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn-danger { color: var(--critical); }
.btn-sm { padding: 5px 10px; font-size: 13px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 100px; font-size: 12px;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.chip.now      { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-text); font-weight: 600; }
.chip.passed   { background: color-mix(in srgb, var(--serious) 20%, transparent); color: var(--ink-2); }
.chip.late     { background: color-mix(in srgb, var(--warning) 24%, transparent); color: var(--ink-2); }

.pager { display: flex; align-items: center; gap: 4px; }
.pager .range { font-size: 14px; font-weight: 600; min-width: 168px; text-align: center; }

.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
.empty h2 { font-size: 18px; color: var(--ink); margin-bottom: 6px; }
.empty p { margin: 0 0 18px; }

/* ---- hero + stat tiles ---- */
.hero { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.hero .figure { font-size: 52px; line-height: 1; font-weight: 650; letter-spacing: -0.03em; }
.hero .of { font-size: 22px; color: var(--muted); font-weight: 500; }
.hero .cap { font-size: 14px; color: var(--ink-2); padding-bottom: 5px; }

.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
.tile .label { font-size: 12px; color: var(--muted); }
.tile .value { font-size: 27px; font-weight: 650; letter-spacing: -0.02em; margin-top: 3px; line-height: 1.15; }
.tile .value small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.tile .delta { font-size: 12px; margin-top: 3px; display: flex; align-items: center; gap: 4px; color: var(--muted); }
.tile .delta.up   { color: var(--good-text); }
.tile .delta.down { color: var(--critical); }

/* ---- meter ---- */
.meter { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); }
.meter > i.full { border-radius: 4px; }

/* ---- today list ---- */
.group-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
               letter-spacing: .06em; margin: 22px 0 8px; }
.tasklist { display: flex; flex-direction: column; gap: 8px; }
.trow {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 12px 16px 12px 12px; box-shadow: var(--shadow);
  transition: opacity .15s, border-color .15s;
}
.trow.is-now { border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
.trow.is-done { opacity: .62; }
.trow.is-done .tname { text-decoration: line-through; text-decoration-color: var(--muted); }

.check {
  flex: none; width: 40px; height: 40px; border-radius: 11px;
  border: 2px solid var(--axis); display: grid; place-items: center;
  color: transparent; transition: all .14s ease;
}
.check:hover { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.check svg { width: 21px; height: 21px; }
.check[aria-pressed="true"] {
  background: var(--good); border-color: var(--good); color: #fff;
  animation: pop .22s ease;
}
@keyframes pop { 0%{transform:scale(.82)} 60%{transform:scale(1.09)} 100%{transform:scale(1)} }

.tmain { flex: 1; min-width: 0; }
.tname { font-weight: 550; display: flex; align-items: center; gap: 8px; }
.tname .emoji { font-size: 17px; }
.tmeta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.tstat { flex: none; text-align: right; font-size: 12px; color: var(--muted); line-height: 1.45; }
.tstat b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }

/* ---- week grid ---- */
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--grid); }
thead th { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.ctr, th.ctr { text-align: center; }
tbody th { font-weight: 550; }
.tfoot td, .tfoot th { border-top: 1px solid var(--axis); font-weight: 600; background: var(--surface-2); }

.mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; }
.mark.done    { background: var(--good); color: #fff; }
.mark.miss    { background: var(--h0); color: var(--muted); }
.mark.na      { color: var(--axis); }
.mark.future  { border: 1px solid var(--grid); }
.mark.pending { border: 2px solid var(--axis); }
.mark svg { width: 15px; height: 15px; }

.col-today { background: color-mix(in srgb, var(--accent) 7%, transparent); }

/* ---- month calendar ---- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .dow { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 2px; font-weight: 600; }
.cal .day {
  position: relative; aspect-ratio: 1; border-radius: 8px; background: var(--h0);
  display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums;
  color: var(--ink-2); border: 1px solid transparent;
}
.cal .day.lv1 { background: var(--h1); }
.cal .day.lv2 { background: var(--h2); }
.cal .day.lv3 { background: var(--h3); color:#fff; }
.cal .day.lv4 { background: var(--h4); color:#fff; }
.cal .day.na  { background: transparent; border-color: var(--grid); color: var(--muted); }
.cal .day.blank { background: none; }
.cal .day.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal .day.future { background: transparent; border: 1px dashed var(--grid); color: var(--axis); }
.cal .day .perfect { position: absolute; top: 3px; right: 4px; font-size: 9px; line-height: 1; }

/* ---- year heatmap ---- */
.hm-scroll { overflow-x: auto; padding-bottom: 6px; }
.hm { display: flex; gap: 4px; width: max-content; }
.hm-col { display: flex; flex-direction: column; gap: 4px; }
.hm-cell {
  width: 13px; height: 13px; border-radius: 3px; background: var(--h0);
  display: grid; place-items: center;
}
.hm-cell.lv1 { background: var(--h1); }
.hm-cell.lv2 { background: var(--h2); }
.hm-cell.lv3 { background: var(--h3); }
.hm-cell.lv4 { background: var(--h4); }
.hm-cell.na  { background: transparent; }
.hm-cell.na::after { content:""; width:3px; height:3px; border-radius:50%; background: var(--grid); }
.hm-cell.void { background: none; }
.hm-cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.hm-months { display: flex; gap: 4px; width: max-content; font-size: 11px; color: var(--muted); margin-bottom: 5px; height: 14px; }
.hm-months span { width: 13px; position: relative; }
.hm-months span b { position: absolute; left: 0; font-weight: 500; white-space: nowrap; }
.hm-rows { display: flex; flex-direction: column; gap: 4px; margin-right: 8px; font-size: 11px; color: var(--muted); }
.hm-rows span { height: 13px; line-height: 13px; }

.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend .sw { width: 13px; height: 13px; border-radius: 3px; display: inline-grid; place-items:center; }
.legend .sw.na { background: transparent; }
.legend .sw.na::after { content:""; width:3px; height:3px; border-radius:50%; background: var(--grid); }

/* ---- month bars (year view) ---- */
.chart { display: flex; gap: 8px; margin-top: 20px; }
.yaxis { position: relative; width: 30px; height: 116px; flex: none; }
.yaxis span { position: absolute; right: 0; transform: translateY(50%); font-size: 10px;
              color: var(--muted); font-variant-numeric: tabular-nums; }
.bars { flex: 1; display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; align-items: end;
        height: 116px; position: relative; }
.bars .gridline { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); }
.bcol { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.bcol > i { display: block; width: 100%; max-width: 24px; margin: 0 auto;
            background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.bcol > i.dim { background: var(--grid); }
.bcol .vlab { position: absolute; bottom: 100%; left: -6px; right: -6px; text-align: center;
              font-size: 11px; font-weight: 600; padding-bottom: 4px; color: var(--ink); }
.bax { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; margin: 6px 0 0 38px;
       font-size: 11px; color: var(--muted); text-align: center; }

/* ---- tooltip ---- */
#tip {
  position: fixed; z-index: 100; pointer-events: none; opacity: 0;
  background: var(--ink); color: var(--page); font-size: 12px; line-height: 1.45;
  padding: 7px 10px; border-radius: var(--r-s); max-width: 240px;
  transition: opacity .1s; box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
#tip.on { opacity: 1; }
#tip b { display: block; font-weight: 650; }

/* ---- dialog ---- */
dialog {
  border: 1px solid var(--border); border-radius: 14px; padding: 0;
  background: var(--surface); color: var(--ink); max-width: 460px; width: calc(100vw - 32px);
  box-shadow: 0 12px 48px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(2px); }
.dlg-head { padding: 18px 20px 0; font-size: 16px; font-weight: 600; }
.dlg-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.dlg-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="time"], select {
  padding: 9px 11px; border-radius: var(--r-s); border: 1px solid var(--border);
  background: var(--page); width: 100%;
}
input[type="text"]:focus, input[type="time"]:focus, select:focus {
  outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent;
}
.dowpick { display: flex; gap: 5px; flex-wrap: wrap; }
.dowpick button {
  width: 42px; padding: 7px 0; border-radius: var(--r-s); border: 1px solid var(--border);
  font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--page);
}
.dowpick button[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #fff; }
.row { display: flex; gap: 10px; align-items: center; }
.switch { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.switch input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---- task manager rows ---- */
.mrow { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--grid); }
.mrow:last-child { border-bottom: none; }
.mrow .grab { color: var(--muted); cursor: grab; font-size: 14px; user-select: none; }
.mrow.dragging { opacity: .4; }
.mrow.over { box-shadow: inset 0 2px 0 var(--accent); }
.mrow .mmain { flex: 1; min-width: 0; }
.mrow.archived .mname { color: var(--muted); }

.banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r);
  background: color-mix(in srgb, var(--warning) 18%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent);
  font-size: 13px; margin-top: 16px;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 620px) {
  .hero .figure { font-size: 42px; }
  .trow { padding: 10px 12px 10px 10px; gap: 10px; }
  .tstat { font-size: 11px; }
  .wrap { padding: 0 14px 60px; }
  .bar, nav { padding-left: 14px; padding-right: 14px; }
}
@media print { header, .noprint { display: none; } }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span> Habits</div>
    <div class="spacer"></div>
    <div class="today-label" id="todayLabel"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <nav id="nav">
    <button data-view="today">Today</button>
    <button data-view="week">Week</button>
    <button data-view="month">Month</button>
    <button data-view="year">Year</button>
    <button data-view="tasks">Tasks</button>
  </nav>
</header>

<main class="wrap" id="app"></main>

<div id="tip" role="status"></div>

<!-- ---------- task editor ---------- -->
<dialog id="taskDlg">
  <form method="dialog" id="taskForm">
    <div class="dlg-head" id="dlgTitle">New task</div>
    <div class="dlg-body">
      <div class="field">
        <label for="fName">Task name</label>
        <div class="row">
          <input type="text" id="fEmoji" style="width:60px;text-align:center" maxlength="4" placeholder="✅" aria-label="Emoji">
          <input type="text" id="fName" placeholder="e.g. Read 20 pages" required maxlength="60">
        </div>
      </div>

      <div class="field">
        <label>Which days?</label>
        <div class="dowpick" id="fDays"></div>
        <div class="row" style="gap:6px;margin-top:2px">
          <button type="button" class="btn btn-sm" data-preset="all">Every day</button>
          <button type="button" class="btn btn-sm" data-preset="weekdays">Weekdays</button>
          <button type="button" class="btn btn-sm" data-preset="weekend">Weekend</button>
        </div>
        <div class="hint">Only the days you pick count toward your completion rate.</div>
      </div>

      <div class="field">
        <label class="switch"><input type="checkbox" id="fUseTime"> Set a time of day</label>
        <div class="row" id="timeRow" hidden>
          <input type="time" id="fStart" value="08:00" aria-label="Window start">
          <span style="color:var(--muted)">to</span>
          <input type="time" id="fEnd" value="10:00" aria-label="Window end">
        </div>
        <div class="hint" id="timeHint" hidden>Used to sort and remind you — checking in outside the window still counts, just marked “late”.</div>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-danger" id="fDelete" hidden>Delete</button>
      <div style="flex:1"></div>
      <button type="button" class="btn" id="fCancel">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json" hidden>

<script>
"use strict";
/* ============================================================================
   Habits — a local, single-file habit / todo tracker.
   Data lives in this browser's localStorage. Nothing leaves the machine.
   ============================================================================ */

const KEY = "habits.v1";
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_MIN   = ["S","M","T","W","T","F","S"];
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const MON_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------------------------------------------------------------- storage */
const DEFAULT_STATE = {
  version: 1,
  settings: { theme: "auto", weekStart: 1 },
  tasks: [],
  log: {},          //  "YYYY-MM-DD" -> { taskId: "HH:MM" | 1 }
  lastExport: null
};

let state = load();
let storageBroken = false;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT_STATE), parsed, {
      settings: Object.assign({}, DEFAULT_STATE.settings, parsed.settings || {})
    });
  } catch (e) {
    console.warn("Could not read saved data:", e);
    storageBroken = true;
    return structuredClone(DEFAULT_STATE);
  }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageBroken = false;
  } catch (e) {
    console.error("Could not save:", e);
    storageBroken = true;
  }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ------------------------------------------------------------ date helpers */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const c = new Date(d.getFullYear(), d.getMonth(), d.getDate()); c.setDate(c.getDate() + n); return c; };
const todayStr = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const minToStr = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const strToMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

function startOfWeek(d) {
  const ws = state.settings.weekStart;
  const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  c.setDate(c.getDate() - ((c.getDay() - ws + 7) % 7));
  return c;
}
/** Weekday column order for the current week-start setting. */
function dowOrder() {
  const ws = state.settings.weekStart;
  return [0, 1, 2, 3, 4, 5, 6].map(i => (i + ws) % 7);
}
function eachDay(fromStr, toStr, fn) {
  let d = parseYmd(fromStr);
  const end = parseYmd(toStr);
  while (d <= end) { fn(ymd(d), d); d = addDays(d, 1); }
}
const fmtDate = (s, opts) =>
  parseYmd(s).toLocaleDateString(undefined, opts || { weekday: "long", month: "long", day: "numeric" });

/* ------------------------------------------------------------ domain logic */
const activeTasks = () => state.tasks.filter(t => !t.archivedOn);

function isScheduled(task, dstr) {
  if (dstr < task.createdOn) return false;
  if (task.archivedOn && dstr > task.archivedOn) return false;
  return task.days.includes(parseYmd(dstr).getDay());
}
const isDone = (id, dstr) => Boolean(state.log[dstr] && state.log[dstr][id]);
const doneTime = (id, dstr) => {
  const v = state.log[dstr] && state.log[dstr][id];
  return typeof v === "string" ? v : null;
};

function toggle(id, dstr) {
  const day = state.log[dstr] || (state.log[dstr] = {});
  if (day[id]) delete day[id];
  else day[id] = dstr === todayStr() ? minToStr(nowMin()) : 1;
  if (!Object.keys(day).length) delete state.log[dstr];
  save();
}

/** Per-task tallies over a date range. Future days are excluded automatically. */
function taskStats(task, fromStr, toStr) {
  const t = todayStr();
  const end = toStr > t ? t : toStr;
  let scheduled = 0, onSchedule = 0, bonus = 0;
  if (end >= fromStr) {
    eachDay(fromStr, end, dstr => {
      const sch = isScheduled(task, dstr);
      const dn = isDone(task.id, dstr);
      if (sch) scheduled++;
      if (dn) (sch ? onSchedule++ : bonus++);
    });
  }
  let upcoming = 0;
  if (toStr > t) {
    eachDay(ymd(addDays(new Date(), 1)), toStr, dstr => { if (isScheduled(task, dstr)) upcoming++; });
  }
  return {
    scheduled, onSchedule, bonus, upcoming,
    done: onSchedule + bonus,
    rate: scheduled ? onSchedule / scheduled : null
  };
}

/** How the whole day went. rate === null means nothing was scheduled. */
function dayStats(dstr) {
  let scheduled = 0, done = 0, checkins = 0;
  for (const task of state.tasks) {
    const sch = isScheduled(task, dstr);
    const dn = isDone(task.id, dstr);
    if (sch) scheduled++;
    if (dn) { checkins++; if (sch) done++; }
  }
  return {
    scheduled, done, checkins,
    rate: scheduled ? done / scheduled : null,
    perfect: scheduled > 0 && done === scheduled
  };
}

/** Consecutive scheduled days completed, ending today. Today pending ≠ broken. */
function currentStreak(task) {
  const t = todayStr();
  let d = new Date(), streak = 0;
  for (let i = 0; i < 3000; i++) {
    const s = ymd(d);
    if (s < task.createdOn) break;
    if (isScheduled(task, s)) {
      if (isDone(task.id, s)) streak++;
      else if (s !== t) break;
    }
    d = addDays(d, -1);
  }
  return streak;
}
function bestStreak(task) {
  let best = 0, run = 0;
  eachDay(task.createdOn, todayStr(), dstr => {
    if (!isScheduled(task, dstr)) return;
    if (isDone(task.id, dstr)) { run++; if (run > best) best = run; }
    else run = 0;
  });
  return best;
}

/** Where "now" sits relative to a task's time window (today only). */
function windowState(task) {
  if (task.startMin == null) return { kind: "any" };
  const now = nowMin(), s = task.startMin, e = task.endMin;
  const wraps = e < s;
  const active = wraps ? (now >= s || now <= e) : (now >= s && now <= e);
  if (active) return { kind: "now" };
  if (now < s) return { kind: "later", inMin: s - now };
  return { kind: "passed" };
}
const windowLabel = t => t.startMin == null ? "" : `${minToStr(t.startMin)}–${minToStr(t.endMin)}`;

function daysLabel(task) {
  const d = [...task.days].sort();
  if (d.length === 7) return "Every day";
  if (d.length === 5 && d.every(x => x >= 1 && x <= 5)) return "Weekdays";
  if (d.length === 2 && d.includes(0) && d.includes(6)) return "Weekends";
  return dowOrder().filter(x => d.includes(x)).map(x => DOW_SHORT[x]).join(", ");
}

function heatLevel(rate) {
  if (rate === null || rate === undefined) return -1;   // nothing scheduled
  if (rate === 0) return 0;                              // scheduled, none done
  if (rate < 0.34) return 1;
  if (rate < 0.67) return 2;
  if (rate < 1) return 3;
  return 4;
}
const pct = r => r === null ? "–" : Math.round(r * 100) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ============================================================================
   Rendering
   ============================================================================ */
const app = document.getElementById("app");
let view = "today";
let weekCursor  = startOfWeek(new Date());
let monthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let yearCursor  = new Date().getFullYear();

const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';
const ICON_DASH  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 12h12"/></svg>';

function render() {
  document.getElementById("todayLabel").textContent =
    new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  document.querySelectorAll("#nav button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));

  if (!state.tasks.length && view !== "tasks") { app.innerHTML = emptyState(); return; }

  app.innerHTML =
    view === "today" ? renderToday() :
    view === "week"  ? renderWeek()  :
    view === "month" ? renderMonth() :
    view === "year"  ? renderYear()  : renderTasks();

  if (storageBroken) app.insertAdjacentHTML("beforeend", storageWarning());
}

const emptyState = () => `
  <div class="empty">
    <h2>No tasks yet</h2>
    <p>Add the things you want to do regularly. Everything is stored on this computer only.</p>
    <button class="btn btn-primary" data-act="new">Add your first task</button>
    <p style="margin-top:14px"><button class="btn btn-sm" data-act="samples">or start from an example set</button></p>
  </div>`;

const storageWarning = () => `
  <div class="banner">
    <span>⚠️</span>
    <div><b>This browser is not saving your data.</b> Private-browsing mode or blocked site data will do
    this. Your check-ins will disappear when you close the tab.</div>
  </div>`;

/* --------------------------------------------------------------- TODAY */
function renderToday() {
  const t = todayStr();
  const scheduled = state.tasks.filter(x => isScheduled(x, t));
  const off = state.tasks.filter(x => !isScheduled(x, t) && !x.archivedOn);
  const ds = dayStats(t);
  const rate = ds.scheduled ? ds.done / ds.scheduled : null;

  // Sorted: active window → upcoming (by start) → anytime → window passed. Done sinks.
  const rank = task => {
    if (isDone(task.id, t)) return 100;
    const w = windowState(task);
    return { now: 0, later: 1, any: 2, passed: 3 }[w.kind];
  };
  scheduled.sort((a, b) => rank(a) - rank(b) ||
    (a.startMin ?? 1e6) - (b.startMin ?? 1e6) || a.order - b.order);

  const perfectStreak = perfectDayStreak();
  const monthStart = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1));

  return `
  <section class="section" style="margin-top:26px">
    <div class="card">
      <div class="hero">
        <div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:6px">${esc(fmtDate(t))}</div>
          <div class="figure">${ds.done}<span class="of"> / ${ds.scheduled}</span></div>
        </div>
        <div class="cap">${ds.scheduled === 0
            ? "Nothing scheduled today."
            : ds.perfect ? "All done for today." : `${ds.scheduled - ds.done} left to go.`}
          ${ds.checkins > ds.done ? `<br><span style="color:var(--muted)">+${ds.checkins - ds.done} extra beyond today's plan</span>` : ""}
        </div>
      </div>
      <div class="meter" style="margin-top:16px" aria-hidden="true">
        <i class="${rate === 1 ? "full" : ""}" style="width:${Math.round((rate || 0) * 100)}%"></i>
      </div>
      <div style="display:flex;gap:20px;margin-top:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap">
        <span><b style="font-weight:650">${perfectStreak}</b> day${perfectStreak === 1 ? "" : "s"} in a row with everything done</span>
        <span style="color:var(--muted)">${monthCountLine(monthStart)}</span>
      </div>
    </div>
  </section>

  ${scheduled.length ? `
    <div class="group-label">Today’s plan</div>
    <div class="tasklist">${scheduled.map(x => taskRow(x, t)).join("")}</div>` : ""}

  ${off.length ? `
    <div class="group-label">Not scheduled today${off.some(x => isDone(x.id, t)) ? "" : " · tap to log anyway"}</div>
    <div class="tasklist">${off.map(x => taskRow(x, t, true)).join("")}</div>` : ""}

  <p class="noprint" style="margin-top:24px;font-size:12px;color:var(--muted)">
    Tip: press <b>1</b>–<b>9</b> to check off the first nine items, or <b>T W M Y</b> to switch views.
  </p>`;
}

function monthCountLine(monthStart) {
  const days = new Set();
  eachDay(monthStart, todayStr(), dstr => { if (state.log[dstr] && Object.keys(state.log[dstr]).length) days.add(dstr); });
  return `${days.size} active day${days.size === 1 ? "" : "s"} in ${MONTHS[new Date().getMonth()]} so far`;
}

function taskRow(task, dstr, offSchedule) {
  const done = isDone(task.id, dstr);
  const w = offSchedule ? { kind: "any" } : windowState(task);
  const streak = currentStreak(task);
  const now = new Date();
  const ms = taskStats(task, ymd(new Date(now.getFullYear(), now.getMonth(), 1)), dstr);

  let chip = "";
  if (task.startMin != null) {
    const label = windowLabel(task);
    if (done) {
      const time = doneTime(task.id, dstr);
      const late = time && !withinWindow(task, strToMin(time));
      chip = `<span class="chip ${late ? "late" : ""}">${time ? "✓ " + esc(time) : "✓ done"}${late ? " · late" : ""}</span>`;
    } else if (offSchedule)         chip = `<span class="chip">${label}</span>`;
    else if (w.kind === "now")      chip = `<span class="chip now">● now · ${label}</span>`;
    else if (w.kind === "later")    chip = `<span class="chip">${label} · in ${humanMin(w.inMin)}</span>`;
    else                            chip = `<span class="chip passed">${label} · window passed</span>`;
  } else if (done) {
    const time = doneTime(task.id, dstr);
    chip = `<span class="chip">${time ? "✓ " + esc(time) : "✓ done"}</span>`;
  }

  return `
  <div class="trow ${done ? "is-done" : ""} ${!done && w.kind === "now" ? "is-now" : ""}">
    <button class="check" data-act="toggle" data-id="${task.id}" data-date="${dstr}"
            aria-pressed="${done}" aria-label="${done ? "Uncheck" : "Check off"} ${esc(task.name)}">${ICON_CHECK}</button>
    <div class="tmain">
      <div class="tname">${task.emoji ? `<span class="emoji">${esc(task.emoji)}</span>` : ""}${esc(task.name)}</div>
      <div class="tmeta">
        ${chip}
        <span class="chip">${esc(daysLabel(task))}</span>
        ${streak > 1 ? `<span class="chip">🔥 ${streak} in a row</span>` : ""}
        ${offSchedule ? `<span class="chip">off-plan</span>` : ""}
      </div>
    </div>
    <div class="tstat" title="Days completed this month">
      <b>${ms.done}</b>${MON_SHORT[new Date().getMonth()]}${ms.scheduled ? ` · ${pct(ms.rate)}` : ""}
    </div>
  </div>`;
}

function withinWindow(task, m) {
  if (task.startMin == null) return true;
  const s = task.startMin, e = task.endMin;
  return e < s ? (m >= s || m <= e) : (m >= s && m <= e);
}
function humanMin(m) {
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
function perfectDayStreak() {
  if (!state.tasks.length) return 0;
  const floor = state.tasks.reduce((a, t) => t.createdOn < a ? t.createdOn : a, "9999-12-31");
  let d = new Date(), streak = 0;
  const t = todayStr();
  for (let i = 0; i < 3000; i++) {
    const s = ymd(d);
    if (s < floor) break;
    const st = dayStats(s);
    if (st.scheduled === 0) { d = addDays(d, -1); continue; }   // rest days don't break it
    if (st.perfect) streak++;
    else if (s === t) { /* today still open */ }
    else break;
    d = addDays(d, -1);
  }
  return streak;
}

/* --------------------------------------------------------------- WEEK */
function renderWeek() {
  const start = startOfWeek(weekCursor);
  const days = Array.from({ length: 7 }, (_, i) => ymd(addDays(start, i)));
  const from = days[0], to = days[6], t = todayStr();

  const prevStart = addDays(start, -7);
  const cur = rangeSummary(from, to);
  const cmp = comparison(from, to, ymd(prevStart), ymd(addDays(prevStart, 6)), "last week");
  const prev = cmp.summary;
  const tasks = state.tasks.filter(x => days.some(d => isScheduled(x, d)) || days.some(d => isDone(x.id, d)));

  const header = days.map(d => {
    const dd = parseYmd(d);
    return `<th class="ctr ${d === t ? "col-today" : ""}">${DOW_MIN[dd.getDay()]}<br>
      <span style="font-weight:400;color:${d === t ? "var(--accent)" : "var(--muted)"}">${dd.getDate()}</span></th>`;
  }).join("");

  const rows = tasks.map(task => {
    const st = taskStats(task, from, to);
    const cells = days.map(d => {
      const sch = isScheduled(task, d), dn = isDone(task.id, d), future = d > t;
      let cls = "na", inner = "", label = "not scheduled";
      if (dn)                 { cls = "done";    inner = ICON_CHECK; label = sch ? "done" : "done (off-plan)"; }
      else if (future && sch) { cls = "future";  label = "upcoming"; }
      else if (sch && d === t) { cls = "pending"; label = "not done yet"; }  // the day isn't over
      else if (sch)           { cls = "miss";    inner = ICON_DASH; label = "missed"; }
      return `<td class="ctr ${d === t ? "col-today" : ""}">
        <span class="mark ${cls}" data-tip="${esc(task.name)}|${esc(fmtDate(d, { weekday: "long", month: "short", day: "numeric" }))} — ${label}">${inner}</span>
        <span class="sr">${label}</span></td>`;
    }).join("");
    return `<tr><th scope="row">${task.emoji ? esc(task.emoji) + " " : ""}${esc(task.name)}</th>${cells}
      <td class="num">${st.scheduled ? `${st.done}/${st.scheduled}` : st.done ? `${st.done}` : "–"}</td>
      <td class="num" style="width:96px">${st.rate === null ? "" :
        `<div class="meter" style="width:72px;display:inline-block;vertical-align:middle"><i class="${st.rate === 1 ? "full" : ""}" style="width:${Math.round(st.rate * 100)}%"></i></div>`}
      </td></tr>`;
  }).join("");

  return `
  ${pagerBar(`Week of ${parseYmd(from).toLocaleDateString(undefined, { month: "long", day: "numeric" })}`,
             "week", isSameWeek(start, new Date()) ? "This week" : "")}

  <div class="tiles section">
    ${tile("Completion", pct(cur.rate), delta(cur.rate, prev.rate, cmp.label))}
    ${tile("Check-ins", cur.done, `of ${cur.scheduled} scheduled so far`)}
    ${tile("Perfect days", cur.perfect, `of ${cur.daysWithPlan} days with a plan`)}
    ${tile("Active days", cur.activeDays, deltaRaw(cur.activeDays, prev.activeDays, cmp.label))}
  </div>

  <section class="section">
    <div class="section-head"><h2>Weekly recap</h2><span class="sub">${recapLine(cur, cmp)}</span></div>
    ${tasks.length ? `
    <div class="tablewrap"><table>
      <thead><tr><th>Task</th>${header}<th class="num">Done</th><th class="num">Rate</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot class="tfoot"><tr><th>All tasks</th>
        ${days.map(d => { const s = dayStats(d);
          const body = !s.scheduled ? "–" : d > t ? `${s.scheduled} due` : `${s.done}/${s.scheduled}`;
          return `<td class="ctr ${d === t ? "col-today" : ""}" style="font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)">${body}</td>`; }).join("")}
        <td class="num">${cur.done}/${cur.scheduled}</td><td class="num">${pct(cur.rate)}</td></tr></tfoot>
    </table></div>` : `<div class="card" style="color:var(--muted)">Nothing was scheduled this week.</div>`}
  </section>

  ${bestWorst(tasks, from, to)}`;
}

function isSameWeek(start, d) { return ymd(startOfWeek(d)) === ymd(start); }

/* --------------------------------------------------------------- MONTH */
function renderMonth() {
  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  const from = ymd(first), to = ymd(last), t = todayStr();
  const cur = rangeSummary(from, to);
  const pm = new Date(y, m - 1, 1);
  const cmp = comparison(from, to, ymd(pm), ymd(new Date(y, m, 0)), MON_SHORT[(m + 11) % 12]);
  const prev = cmp.summary;

  // calendar grid
  const lead = (first.getDay() - state.settings.weekStart + 7) % 7;
  let cells = Array.from({ length: lead }, () => `<div class="day blank"></div>`);
  for (let dnum = 1; dnum <= last.getDate(); dnum++) {
    const dstr = ymd(new Date(y, m, dnum));
    const s = dayStats(dstr);
    const future = dstr > t;
    const lv = heatLevel(s.rate);
    const cls = future ? "future" : lv === -1 ? "na" : `lv${lv}`;
    const tipTitle = fmtDate(dstr, { weekday: "long", month: "short", day: "numeric" });
    const tipBody = future ? (s.scheduled ? `${s.scheduled} scheduled` : "nothing scheduled")
                  : s.rate === null ? "nothing scheduled"
                  : `${s.done} of ${s.scheduled} done${s.checkins > s.done ? ` (+${s.checkins - s.done} extra)` : ""}`;
    cells.push(`<div class="day ${cls} ${dstr === t ? "today" : ""}" data-tip="${esc(tipTitle)}|${esc(tipBody)}">
      ${dnum}${s.perfect && !future ? '<span class="perfect">★</span>' : ""}</div>`);
  }
  const dowHead = dowOrder().map(i => `<div class="dow">${DOW_MIN[i]}</div>`).join("");

  const tasks = state.tasks.filter(x => x.createdOn <= to && (!x.archivedOn || x.archivedOn >= from));
  const rows = tasks.map(task => {
    const st = taskStats(task, from, to);
    const pv = taskStats(task, cmp.from, cmp.to);
    return `<tr>
      <th scope="row">${task.emoji ? esc(task.emoji) + " " : ""}${esc(task.name)}</th>
      <td class="num" style="font-size:15px;font-weight:600">${st.done}</td>
      <td class="num" style="color:var(--muted)">${st.scheduled}${st.upcoming ? ` <span style="font-size:11px">(+${st.upcoming} to come)</span>` : ""}</td>
      <td class="num">${pct(st.rate)}</td>
      <td style="width:110px"><div class="meter"><i class="${st.rate === 1 ? "full" : ""}" style="width:${Math.round((st.rate || 0) * 100)}%"></i></div></td>
      <td class="num" style="font-size:12px">${deltaText(st.done - pv.done)}</td>
    </tr>`;
  }).join("");

  return `
  ${pagerBar(`${MONTHS[m]} ${y}`, "month",
             (y === new Date().getFullYear() && m === new Date().getMonth()) ? "This month" : "")}

  <div class="tiles section">
    ${tile("Completion", pct(cur.rate), delta(cur.rate, prev.rate, cmp.label))}
    ${tile("Check-ins", cur.done, `of ${cur.scheduled} scheduled so far`)}
    ${tile("Perfect days", cur.perfect, `of ${cur.daysWithPlan} days with a plan`)}
    ${tile("Active days", cur.activeDays, deltaRaw(cur.activeDays, prev.activeDays, cmp.label))}
  </div>

  <section class="section">
    <div class="section-head"><h2>Monthly recap</h2><span class="sub">${recapLine(cur, cmp)}</span></div>
    <div class="card">
      <div class="cal">${dowHead}${cells.join("")}</div>
      <div class="legend" style="margin-top:14px">
        <span class="sw na"></span><span>none scheduled</span>
        <span style="width:8px"></span>
        <span>0%</span>
        <span class="sw" style="background:var(--h0)"></span>
        <span class="sw" style="background:var(--h1)"></span>
        <span class="sw" style="background:var(--h2)"></span>
        <span class="sw" style="background:var(--h3)"></span>
        <span class="sw" style="background:var(--h4)"></span>
        <span>100%</span>
        <span style="width:8px"></span><span>★ perfect day</span>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Days done per task</h2><span class="sub">${MONTHS[m]} ${y}</span></div>
    ${tasks.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Task</th><th class="num">Days done</th><th class="num">Scheduled</th>
        <th class="num">Rate</th><th></th><th class="num">vs prev.</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : `<div class="card" style="color:var(--muted)">No tasks existed in this month.</div>`}
  </section>

  ${bestWorst(tasks, from, to)}`;
}

/* --------------------------------------------------------------- YEAR */
function renderYear() {
  const y = yearCursor;
  const from = `${y}-01-01`, to = `${y}-12-31`, t = todayStr();
  const cur = rangeSummary(from, to);
  const cmp = comparison(from, to, `${y - 1}-01-01`, `${y - 1}-12-31`, String(y - 1));
  const prev = cmp.summary;

  // ---- contribution heatmap: one column per week
  const gridStart = startOfWeek(parseYmd(from));
  const gridEnd = addDays(startOfWeek(parseYmd(to)), 6);
  const cols = [];
  const monthMarks = [];
  let d = gridStart, colIdx = 0, lastMonth = -1;
  while (d <= gridEnd) {
    const cells = [];
    for (let i = 0; i < 7; i++) {
      const day = addDays(d, i);
      const dstr = ymd(day);
      if (day.getFullYear() !== y) { cells.push(`<div class="hm-cell void"></div>`); continue; }
      if (day.getDate() <= 7 && day.getMonth() !== lastMonth) {
        monthMarks.push([colIdx, day.getMonth()]); lastMonth = day.getMonth();
      }
      const s = dayStats(dstr);
      if (dstr > t) { cells.push(`<div class="hm-cell void" data-tip="${esc(fmtDate(dstr, { month: "short", day: "numeric" }))}|upcoming"></div>`); continue; }
      const lv = heatLevel(s.rate);
      const body = s.rate === null ? "nothing scheduled"
                 : `${s.done} of ${s.scheduled} done${s.checkins > s.done ? ` (+${s.checkins - s.done} extra)` : ""}`;
      cells.push(`<div class="hm-cell ${lv === -1 ? "na" : "lv" + lv} ${dstr === t ? "today" : ""}"
        data-tip="${esc(fmtDate(dstr, { weekday: "short", month: "short", day: "numeric" }))}|${esc(body)}"></div>`);
    }
    cols.push(`<div class="hm-col">${cells.join("")}</div>`);
    d = addDays(d, 7); colIdx++;
  }
  const monthRow = Array.from({ length: cols.length }, (_, i) => {
    const hit = monthMarks.find(([c]) => c === i);
    return `<span>${hit ? `<b>${MON_SHORT[hit[1]]}</b>` : ""}</span>`;
  }).join("");

  // ---- per-month completion columns (one series → one hue)
  const monthly = Array.from({ length: 12 }, (_, mi) => {
    const a = ymd(new Date(y, mi, 1)), b = ymd(new Date(y, mi + 1, 0));
    return rangeSummary(a, b);
  });
  const maxIdx = monthly.reduce((best, s, i) => (s.rate ?? -1) > (monthly[best].rate ?? -1) ? i : best, 0);
  const bars = monthly.map((s, mi) => {
    const has = s.scheduled > 0;
    const h = Math.round((s.rate || 0) * 100);
    return `<div class="bcol" data-tip="${MONTHS[mi]} ${y}|${has ? `${s.done} of ${s.scheduled} — ${pct(s.rate)}` : "nothing scheduled"}">
      ${has && mi === maxIdx ? `<span class="vlab">${pct(s.rate)}</span>` : ""}
      <i class="${has ? "" : "dim"}" style="height:${has ? Math.max(h, 2) : 2}%"></i></div>`;
  }).join("");

  const tasks = state.tasks.filter(x => x.createdOn <= to && (!x.archivedOn || x.archivedOn >= from));
  const rows = tasks.map(task => {
    const st = taskStats(task, from, to);
    return `<tr>
      <th scope="row">${task.emoji ? esc(task.emoji) + " " : ""}${esc(task.name)}</th>
      <td class="num" style="font-size:15px;font-weight:600">${st.done}</td>
      <td class="num" style="color:var(--muted)">${st.scheduled}</td>
      <td class="num">${pct(st.rate)}</td>
      <td style="width:110px"><div class="meter"><i class="${st.rate === 1 ? "full" : ""}" style="width:${Math.round((st.rate || 0) * 100)}%"></i></div></td>
      <td class="num">${bestStreak(task)}</td>
    </tr>`;
  }).join("");

  return `
  ${pagerBar(String(y), "year", y === new Date().getFullYear() ? "This year" : "")}

  <div class="tiles section">
    ${tile("Check-ins", cur.done, `across ${tasks.length} task${tasks.length === 1 ? "" : "s"}`)}
    ${tile("Completion", pct(cur.rate), delta(cur.rate, prev.rate, cmp.label))}
    ${tile("Perfect days", cur.perfect, `of ${cur.daysWithPlan} days with a plan`)}
    ${tile("Active days", cur.activeDays, `days with at least one check-in`)}
  </div>

  <section class="section">
    <div class="section-head"><h2>The year at a glance</h2>
      <span class="sub">each square is a day, shaded by how much of that day’s plan you finished</span></div>
    <div class="card">
      <div class="hm-scroll">
        <div style="display:flex">
          <div class="hm-rows" style="padding-top:19px">
            ${dowOrder().map((i, n) => `<span>${n % 2 === 0 ? DOW_SHORT[i] : ""}</span>`).join("")}
          </div>
          <div>
            <div class="hm-months">${monthRow}</div>
            <div class="hm">${cols.join("")}</div>
          </div>
        </div>
      </div>
      <div class="legend" style="margin-top:14px">
        <span class="sw na"></span><span>none scheduled</span>
        <span style="width:8px"></span><span>0%</span>
        <span class="sw" style="background:var(--h0)"></span>
        <span class="sw" style="background:var(--h1)"></span>
        <span class="sw" style="background:var(--h2)"></span>
        <span class="sw" style="background:var(--h3)"></span>
        <span class="sw" style="background:var(--h4)"></span>
        <span>100%</span>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Completion by month</h2><span class="sub">share of scheduled check-ins finished</span></div>
    <div class="card">
      <div class="chart">
        <div class="yaxis"><span style="bottom:100%">100%</span><span style="bottom:50%">50%</span><span style="bottom:0">0%</span></div>
        <div class="bars">
          <div class="gridline" style="bottom:100%"></div>
          <div class="gridline" style="bottom:50%"></div>
          <div class="gridline" style="bottom:0"></div>
          ${bars}
        </div>
      </div>
      <div class="bax">${MON_SHORT.map(x => `<span>${x[0]}</span>`).join("")}</div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Days done per task</h2><span class="sub">${y}</span></div>
    ${tasks.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Task</th><th class="num">Days done</th><th class="num">Scheduled</th>
        <th class="num">Rate</th><th></th><th class="num">Best streak</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : `<div class="card" style="color:var(--muted)">No tasks existed in this year.</div>`}
  </section>`;
}

/* ---------------------------------------------------------- shared pieces */
function pagerBar(label, kind, badge) {
  return `<div class="section-head" style="margin-top:26px;align-items:center">
    <div class="pager">
      <button class="icon-btn" data-act="prev" data-kind="${kind}" aria-label="Previous ${kind}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="range">${esc(label)}</span>
      <button class="icon-btn" data-act="next" data-kind="${kind}" aria-label="Next ${kind}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    ${badge ? `<span class="chip">${badge}</span>`
            : `<button class="btn btn-sm" data-act="now" data-kind="${kind}">Jump to today</button>`}
  </div>`;
}

const tile = (label, value, sub) => `
  <div class="tile"><div class="label">${label}</div>
  <div class="value">${value}</div>
  <div class="delta ${typeof sub === "object" ? sub.cls : ""}">${typeof sub === "object" ? sub.text : sub}</div></div>`;

function delta(cur, prev, suffix) {
  if (cur === null || prev === null) return { cls: "", text: suffix ? "no comparison yet" : "" };
  const d = Math.round((cur - prev) * 100);
  return { cls: d > 0 ? "up" : d < 0 ? "down" : "",
           text: `${d > 0 ? "▲ +" : d < 0 ? "▼ " : "±"}${d === 0 ? "0" : d}pp ${suffix}` };
}
function deltaRaw(cur, prev, suffix) {
  const d = cur - prev;
  return { cls: d > 0 ? "up" : d < 0 ? "down" : "",
           text: `${d > 0 ? "▲ +" : d < 0 ? "▼ " : "±"}${d === 0 ? "0" : d} ${suffix}` };
}
const deltaText = d => d === 0 ? `<span style="color:var(--muted)">±0</span>`
  : `<span style="color:${d > 0 ? "var(--good-text)" : "var(--critical)"}">${d > 0 ? "▲ +" : "▼ "}${d}</span>`;

/** Aggregate everything in a date range (future days excluded from rate). */
function rangeSummary(fromStr, toStr) {
  const t = todayStr();
  const end = toStr > t ? t : toStr;
  let scheduled = 0, done = 0, checkins = 0, perfect = 0, daysWithPlan = 0, activeDays = 0;
  if (end >= fromStr) {
    eachDay(fromStr, end, dstr => {
      const s = dayStats(dstr);
      scheduled += s.scheduled; done += s.done; checkins += s.checkins;
      if (s.scheduled) daysWithPlan++;
      if (s.perfect) perfect++;
      if (s.checkins) activeDays++;
    });
  }
  return { scheduled, done, checkins, perfect, daysWithPlan, activeDays,
           rate: scheduled ? done / scheduled : null };
}

/** Days of a range that have actually happened yet. */
function elapsed(fromStr, toStr) {
  const t = todayStr();
  const end = toStr > t ? t : toStr;
  if (end < fromStr) return 0;
  return Math.round((parseYmd(end) - parseYmd(fromStr)) / 864e5) + 1;
}
const periodLength = (fromStr, toStr) => Math.round((parseYmd(toStr) - parseYmd(fromStr)) / 864e5) + 1;

/**
 * The previous period, truncated to the same number of elapsed days — otherwise a
 * Tuesday would always look catastrophic next to a finished week.
 */
function comparison(fromStr, toStr, prevFrom, prevTo, name) {
  const days = elapsed(fromStr, toStr);
  const inProgress = days > 0 && days < periodLength(fromStr, toStr);
  const to = inProgress ? ymd(addDays(parseYmd(prevFrom), days - 1)) : prevTo;
  return {
    from: prevFrom, to, inProgress,
    summary: rangeSummary(prevFrom, to),
    label: inProgress ? `vs ${name} at this point` : `vs ${name}`
  };
}

function recapLine(cur, cmp) {
  if (!cur.scheduled) return "nothing scheduled yet";
  const d = cur.done - cmp.summary.done;
  const ref = cmp.label.replace(/^vs /, "");
  const dir = d > 0 ? `${d} more than ${ref}` : d < 0 ? `${-d} fewer than ${ref}` : `level with ${ref}`;
  return `${cur.done} of ${cur.scheduled} check-ins done — ${dir}`;
}

function bestWorst(tasks, from, to) {
  const scored = tasks.map(t => ({ t, s: taskStats(t, from, to) })).filter(x => x.s.scheduled >= 2);
  if (scored.length < 2) return "";
  scored.sort((a, b) => b.s.rate - a.s.rate);
  const best = scored[0], worst = scored[scored.length - 1];
  if (best.s.rate === worst.s.rate) return "";
  return `<section class="section"><div class="tiles">
    <div class="tile"><div class="label">Most consistent</div>
      <div class="value" style="font-size:17px;line-height:1.35">${best.t.emoji ? esc(best.t.emoji) + " " : ""}${esc(best.t.name)}</div>
      <div class="delta up">${best.s.done} of ${best.s.scheduled} · ${pct(best.s.rate)}</div></div>
    <div class="tile"><div class="label">Needs attention</div>
      <div class="value" style="font-size:17px;line-height:1.35">${worst.t.emoji ? esc(worst.t.emoji) + " " : ""}${esc(worst.t.name)}</div>
      <div class="delta down">${worst.s.done} of ${worst.s.scheduled} · ${pct(worst.s.rate)}</div></div>
  </div></section>`;
}

/* ============================================================================
   Task editor dialog
   ============================================================================ */
const dlg = document.getElementById("taskDlg");
const fDays = document.getElementById("fDays");
let editingId = null;
let pickedDays = new Set([0, 1, 2, 3, 4, 5, 6]);

function paintDays() {
  fDays.innerHTML = dowOrder().map(i =>
    `<button type="button" data-dow="${i}" aria-pressed="${pickedDays.has(i)}">${DOW_SHORT[i]}</button>`).join("");
}
fDays.addEventListener("click", e => {
  const b = e.target.closest("button[data-dow]"); if (!b) return;
  const i = +b.dataset.dow;
  pickedDays.has(i) ? pickedDays.delete(i) : pickedDays.add(i);
  paintDays();
});
document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
  const p = b.dataset.preset;
  pickedDays = new Set(p === "all" ? [0, 1, 2, 3, 4, 5, 6] : p === "weekdays" ? [1, 2, 3, 4, 5] : [0, 6]);
  paintDays();
}));

const fUseTime = document.getElementById("fUseTime");
fUseTime.addEventListener("change", () => {
  document.getElementById("timeRow").hidden = !fUseTime.checked;
  document.getElementById("timeHint").hidden = !fUseTime.checked;
});

function openTask(id) {
  editingId = id || null;
  const task = id ? state.tasks.find(x => x.id === id) : null;
  document.getElementById("dlgTitle").textContent = task ? "Edit task" : "New task";
  document.getElementById("fName").value = task ? task.name : "";
  document.getElementById("fEmoji").value = task ? (task.emoji || "") : "";
  pickedDays = new Set(task ? task.days : [0, 1, 2, 3, 4, 5, 6]);
  paintDays();
  const hasWin = Boolean(task && task.startMin != null);
  fUseTime.checked = hasWin;
  document.getElementById("timeRow").hidden = !hasWin;
  document.getElementById("timeHint").hidden = !hasWin;
  if (hasWin) {
    document.getElementById("fStart").value = minToStr(task.startMin);
    document.getElementById("fEnd").value = minToStr(task.endMin);
  }
  const del = document.getElementById("fDelete");
  del.hidden = !task;
  del.textContent = task && !task.archivedOn ? "Archive" : "Delete";
  dlg.showModal();
  setTimeout(() => document.getElementById("fName").focus(), 30);
}

document.getElementById("fCancel").addEventListener("click", () => dlg.close());

document.getElementById("taskForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("fName").value.trim();
  if (!name) return;
  if (!pickedDays.size) { alert("Pick at least one day of the week."); return; }
  const useTime = fUseTime.checked;
  const patch = {
    name,
    emoji: document.getElementById("fEmoji").value.trim().slice(0, 4),
    days: [...pickedDays].sort(),
    startMin: useTime ? strToMin(document.getElementById("fStart").value || "08:00") : null,
    endMin:   useTime ? strToMin(document.getElementById("fEnd").value || "10:00") : null
  };
  if (editingId) {
    Object.assign(state.tasks.find(x => x.id === editingId), patch);
  } else {
    state.tasks.push(Object.assign({
      id: uid(), createdOn: todayStr(), archivedOn: null,
      order: state.tasks.length
    }, patch));
  }
  save(); dlg.close(); render();
});

document.getElementById("fDelete").addEventListener("click", () => {
  const task = state.tasks.find(x => x.id === editingId);
  if (!task) return;
  if (task.archivedOn) {
    if (!confirm(`Permanently delete “${task.name}” and its ${taskStats(task, task.createdOn, todayStr()).done} logged days? This cannot be undone.`)) return;
    state.tasks = state.tasks.filter(x => x.id !== task.id);
    for (const d of Object.keys(state.log)) {
      delete state.log[d][task.id];
      if (!Object.keys(state.log[d]).length) delete state.log[d];
    }
  } else {
    if (!confirm(`Archive “${task.name}”? It stops being scheduled from tomorrow, but its history is kept.`)) return;
    task.archivedOn = todayStr();
  }
  save(); dlg.close(); render();
});

/* ============================================================================
   Events
   ============================================================================ */
document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  view = b.dataset.view; render(); window.scrollTo({ top: 0 });
});

app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;

  if (act === "toggle") {
    toggle(el.dataset.id, el.dataset.date);
    render();
  } else if (act === "new")       { openTask(null); }
  else if (act === "edit")        { openTask(el.dataset.id); }
  else if (act === "unarchive")   { const t = state.tasks.find(x => x.id === el.dataset.id); t.archivedOn = null; save(); render(); }
  else if (act === "prev" || act === "next") {
    const dir = act === "next" ? 1 : -1;
    if (el.dataset.kind === "week")  weekCursor = addDays(startOfWeek(weekCursor), 7 * dir);
    if (el.dataset.kind === "month") monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + dir, 1);
    if (el.dataset.kind === "year")  yearCursor += dir;
    render();
  } else if (act === "now") {
    weekCursor = startOfWeek(new Date());
    monthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    yearCursor = new Date().getFullYear();
    render();
  } else if (act === "export")  { exportData(); }
  else if (act === "import")    { document.getElementById("importFile").click(); }
  else if (act === "reset")     { resetData(); }
  else if (act === "samples")   { loadSamples(); }
});

app.addEventListener("change", e => {
  if (e.target.id === "weekStart") {
    state.settings.weekStart = +e.target.value;
    weekCursor = startOfWeek(new Date());
    save(); render();
  }
});

/* ---- drag to reorder (Tasks view) ---- */
let dragId = null;
app.addEventListener("dragstart", e => {
  const row = e.target.closest(".mrow[draggable=true]"); if (!row) return;
  dragId = row.dataset.id; row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
});
app.addEventListener("dragover", e => {
  const row = e.target.closest(".mrow[draggable=true]"); if (!row || !dragId) return;
  e.preventDefault();
  document.querySelectorAll(".mrow.over").forEach(r => r.classList.remove("over"));
  row.classList.add("over");
});
app.addEventListener("drop", e => {
  const row = e.target.closest(".mrow[draggable=true]"); if (!row || !dragId) return;
  e.preventDefault();
  const ids = state.tasks.filter(x => !x.archivedOn).map(x => x.id);
  const from = ids.indexOf(dragId), to = ids.indexOf(row.dataset.id);
  if (from > -1 && to > -1 && from !== to) {
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    ids.forEach((id, i) => { state.tasks.find(x => x.id === id).order = i; });
    state.tasks.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    save();
  }
  dragId = null; render();
});
app.addEventListener("dragend", () => {
  dragId = null;
  document.querySelectorAll(".dragging,.over").forEach(r => r.classList.remove("dragging", "over"));
});

/* ---- tooltip ---- */
const tip = document.getElementById("tip");
app.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]"); if (!el) return;
  const [title, body] = el.dataset.tip.split("|");
  tip.innerHTML = `<b>${title}</b>${body || ""}`;
  tip.classList.add("on");
  place(el);
});
app.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) tip.classList.remove("on"); });
app.addEventListener("scroll", () => tip.classList.remove("on"), true);
window.addEventListener("scroll", () => tip.classList.remove("on"));
function place(el) {
  const r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect();
  let x = r.left + r.width / 2 - tr.width / 2;
  let y = r.top - tr.height - 8;
  x = Math.max(8, Math.min(x, innerWidth - tr.width - 8));
  if (y < 8) y = r.bottom + 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

/* ---- theme ---- */
const themeBtn = document.getElementById("themeBtn");
function applyTheme() {
  const t = state.settings.theme;
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.title = `Theme: ${t}. Click to change.`;
}
themeBtn.addEventListener("click", () => {
  const order = ["auto", "light", "dark"];
  state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % 3];
  save(); applyTheme();
});

/* ---- keyboard ---- */
document.addEventListener("keydown", e => {
  if (dlg.open || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const jump = { t: "today", w: "week", m: "month", y: "year" }[k];
  if (jump) { view = jump; render(); return; }
  if (view === "today" && /^[1-9]$/.test(k)) {
    const btn = app.querySelectorAll('.check[data-act="toggle"]')[+k - 1];
    if (btn) { btn.click(); btn.focus(); }
  }
  if (k === "n") { e.preventDefault(); openTask(null); }
});

/* ---- backup ---- */
function exportData() {
  state.lastExport = todayStr(); save();
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `habits-backup-${todayStr()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  render();
}
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.tasks) || typeof data.log !== "object")
        throw new Error("Not a Habits backup file.");
      if (!confirm(`Replace everything currently here with this backup?\n\n${data.tasks.length} tasks, ${Object.keys(data.log).length} logged days.`)) return;
      state = Object.assign(structuredClone(DEFAULT_STATE), data, {
        settings: Object.assign({}, DEFAULT_STATE.settings, data.settings || {})
      });
      save(); applyTheme(); render();
    } catch (err) { alert("Could not read that file: " + err.message); }
  };
  reader.readAsText(file);
  e.target.value = "";
});
function resetData() {
  if (!confirm("Erase all tasks and history? Export a backup first if you might want it back.")) return;
  if (!confirm("Really erase everything? This cannot be undone.")) return;
  state = structuredClone(DEFAULT_STATE);
  save(); applyTheme(); render();
}

function loadSamples() {
  const mk = (name, emoji, days, s, e) => ({
    id: uid(), name, emoji, days, createdOn: todayStr(), archivedOn: null,
    order: state.tasks.length + Math.random(),
    startMin: s == null ? null : strToMin(s), endMin: e == null ? null : strToMin(e)
  });
  state.tasks.push(
    mk("Morning walk", "🚶", [0, 1, 2, 3, 4, 5, 6], "07:00", "09:00"),
    mk("Gym", "🏋️", [1, 3, 5], "17:00", "20:00"),
    mk("Read 20 pages", "📖", [0, 1, 2, 3, 4, 5, 6], "21:00", "23:30"),
    mk("Study", "📚", [1, 2, 3, 4, 5], null, null),
    mk("Tidy the flat", "🧹", [6], null, null)
  );
  state.tasks.forEach((t, i) => t.order = i);
  save(); view = "today"; render();
}

/* ---- boot ---- */
applyTheme();
paintDays();
state.tasks.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
render();

// Keep a tab left open honest: re-render as time windows shift and at midnight.
const clock = { stamp: todayStr() + "|" + Math.floor(nowMin() / 5) };
setInterval(() => {
  const stamp = todayStr() + "|" + Math.floor(nowMin() / 5);
  if (stamp !== clock.stamp) { clock.stamp = stamp; if (view === "today") render(); }
}, 60000);
</script>
